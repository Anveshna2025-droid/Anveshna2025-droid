<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="220" height="220">
  <defs>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e0aaff"/>
      <stop offset="55%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#3c096c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background twinkling stars -->
  <circle cx="20" cy="30" r="1.4" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="50" r="1.2" fill="#e0aaff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="250" r="1.3" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="240" r="1.5" fill="#c77dff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="15" r="1.1" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="150" r="1.2" fill="#e0aaff">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="160" r="1.3" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- soft glow behind planet -->
  <circle cx="150" cy="150" r="90" fill="url(#glow)"/>

  <!-- orbit ring path (guide) -->
  <ellipse cx="150" cy="150" rx="110" ry="40" fill="none" stroke="#7b2cbf" stroke-width="1" opacity="0.35"/>

  <!-- planet -->
  <circle cx="150" cy="150" r="42" fill="url(#planetGrad)">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting moon along the ellipse path -->
  <circle r="7" fill="#e0aaff">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 260,150 A 110,40 0 1,1 40,150 A 110,40 0 1,1 260,150"/>
  </circle>

  <!-- second smaller orbiting spark, opposite direction, different path -->
  <circle r="3" fill="#00f5ff" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M 150,80 A 70,70 0 1,0 150,220 A 70,70 0 1,0 150,80"/>
  </circle>
</svg>
