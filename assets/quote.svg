<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10002b"/>
      <stop offset="50%" stop-color="#240046"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
  </defs>
  <rect width="900" height="180" rx="18" fill="url(#bg)"/>
  <text x="40" y="70" font-family="Georgia, serif" font-size="90" fill="#7b2cbf" opacity="0.5">&#8220;</text>
  <text x="450" y="85" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#e0aaff" text-anchor="middle">
    The best way to predict the future
  </text>
  <text x="450" y="118" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#e0aaff" text-anchor="middle">
    is to invent it.
  </text>
  <text x="450" y="152" font-family="Fira Code, monospace" font-size="16" fill="#9d4edd" text-anchor="middle">
    — Alan Kay
  </text>
  <text x="860" y="150" font-family="Georgia, serif" font-size="90" fill="#7b2cbf" opacity="0.5">&#8221;</text>
</svg>
