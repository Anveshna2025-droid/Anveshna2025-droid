<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="tail1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0aaff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e0aaff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tail2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="head1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0aaff"/>
    </radialGradient>
    <radialGradient id="head2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </radialGradient>
  </defs>

  <!-- background twinkling stars -->
  <circle cx="40" cy="30" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="60" r="1" fill="#e0aaff"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="25" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="70" r="1.1" fill="#c77dff"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="20" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="510" cy="55" r="1.2" fill="#e0aaff"><animate attributeName="opacity" values="1;0.25;1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="150" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="170" r="1" fill="#c77dff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="160" r="1.1" fill="#ffffff"><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="130" r="1" fill="#e0aaff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>

  <!-- Comet 1 -->
  <g>
    <rect x="-80" y="-1.5" width="80" height="3" fill="url(#tail1)"/>
    <circle r="4" fill="url(#head1)"/>
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M -20,30 L 640,150" rotate="auto"/>
  </g>

  <!-- Comet 2, staggered, different path -->
  <g>
    <rect x="-60" y="-1.2" width="60" height="2.4" fill="url(#tail2)"/>
    <circle r="3" fill="url(#head2)"/>
    <animateMotion dur="6s" begin="1.8s" repeatCount="indefinite"
      path="M -20,160 L 640,40" rotate="auto"/>
  </g>

  <!-- Comet 3, subtle, slow -->
  <g>
    <rect x="-50" y="-1" width="50" height="2" fill="url(#tail1)" opacity="0.6"/>
    <circle r="2.5" fill="url(#head1)" opacity="0.8"/>
    <animateMotion dur="8s" begin="4s" repeatCount="indefinite"
      path="M -20,90 L 640,110" rotate="auto"/>
  </g>
</svg>
